[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every path (/echipa, /contact...) is served by index.html and handled by
# React Router, so reloading or opening a direct link doesn't return 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
